<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apontamentos Mensais - Folha de Pagamento</title>
<style>
  :root {
    --azul: #0a4d8c;
    --azul-claro: #e8f1fb;
    --cinza: #f4f4f4;
    --borda: #d8d8d8;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    margin: 0;
    background: var(--cinza);
    color: #222;
  }
  header {
    background: var(--azul);
    color: #fff;
    padding: 20px 24px;
  }
  header h1 { margin: 0 0 4px 0; font-size: 1.4rem; }
  header p { margin: 0; opacity: .85; font-size: .9rem; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    padding: 14px 24px;
    background: #fff;
    border-bottom: 1px solid var(--borda);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .toolbar input[type="text"], .toolbar select {
    padding: 8px 10px;
    border: 1px solid var(--borda);
    border-radius: 6px;
    font-size: .95rem;
  }
  .toolbar input[type="text"] { flex: 1; min-width: 220px; }
  .toolbar button {
    padding: 8px 14px;
    background: var(--azul);
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: .9rem;
  }
  .toolbar button:hover { background: #08396b; }
  .resumo {
    padding: 14px 24px;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .card-resumo {
    background: #fff;
    border: 1px solid var(--borda);
    border-radius: 8px;
    padding: 12px 18px;
    min-width: 160px;
  }
  .card-resumo .num { font-size: 1.3rem; font-weight: 700; color: var(--azul); }
  .card-resumo .lbl { font-size: .8rem; color: #666; }

  main { padding: 0 24px 40px 24px; }

  .grupo { margin-bottom: 24px; }
  .grupo-titulo {
    background: var(--azul);
    color: #fff;
    padding: 8px 14px;
    border-radius: 6px 6px 0 0;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
  }
  .grupo-titulo .total { font-weight: 400; opacity: .9; font-size: .9rem; }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    font-size: .85rem;
  }
  thead th {
    background: var(--azul-claro);
    text-align: left;
    padding: 8px 10px;
    border-bottom: 2px solid var(--borda);
    white-space: nowrap;
    position: sticky;
    top: 58px;
  }
  tbody td {
    padding: 7px 10px;
    border-bottom: 1px solid var(--borda);
    white-space: nowrap;
  }
  tbody tr:hover { background: #fafdff; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.nome { white-space: normal; min-width: 200px; font-weight: 600; }
  .destaque { color: #b30000; font-weight: 600; }
  .salario { color: #0a7a2e; font-weight: 700; }

  footer {
    text-align: center;
    padding: 16px;
    font-size: .8rem;
    color: #888;
  }

  @media print {
    .toolbar, .resumo { display: none; }
    body { background: #fff; }
    .grupo-titulo { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    thead th { position: static; }
  }
</style>
</head>
<body>

<header>
  <h1>Apontamentos Mensais de Funcionários</h1>
  <p id="periodo-label">BRX Manutenção e Instalação de Máquinas LTDA</p>
</header>

<div class="toolbar">
  <input type="text" id="busca" placeholder="Buscar funcionário ou cargo...">
  <select id="filtroCentro">
    <option value="">Todos os centros de custo</option>
  </select>
  <button onclick="window.print()">Imprimir / PDF</button>
  <button onclick="exportarCSV()">Exportar CSV</button>
</div>

<div class="resumo" id="resumo"></div>

<main id="conteudo"></main>

<footer>Gerado automaticamente a partir da folha de apontamentos mensal.</footer>

const COLS = [
  {k:"COLABORADOR", l:"Colaborador"},
  {k:"CARGO", l:"Cargo"},
  {k:"SALÁRIO", l:"Salário", money:true, cls:"salario"},
  {k:"DIAS DE SALARIO", l:"Dias Sal."},
  {k:"QTD HE 50%", l:"HE 50%"},
  {k:"QTD HE 100%", l:"HE 100%"},
  {k:"QTD ADICIONAL NOTURNO", l:"Ad. Noturno"},
  {k:"FALTAS", l:"Faltas", destaque:true},
  {k:"ATRASOS", l:"Atrasos", destaque:true},
  {k:"DESCONTO CONVÊNIO", l:"Desc. Convênio", money:true},
  {k:"DESCONTO EMPRÉSTIMO", l:"Desc. Empréstimo", money:true},
  {k:"VT Á PAGAR ", l:"VT a Pagar", money:true},
  {k:"VALORES PAGO DE VT", l:"VT Pago", money:true},
  {k:"VALORES PAGO DE VR", l:"VR Pago", money:true},
  {k:"VALORES PAGO DE VA", l:"VA Pago", money:true},
  {k:"VALORES PAGOS DE CONVÊNIO MÉDICO", l:"Convênio Médico", money:true},
];

function fmtMoney(v){
  if (typeof v !== "number") return v ?? "";
  return v.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}
function fmtVal(v, col){
  if (v === null || v === undefined || v === "") return "-";
  if (col.money && typeof v === "number") return fmtMoney(v);
  if (typeof v === "number") return v.toLocaleString('pt-BR', {maximumFractionDigits:2});
  return v;
}

function centrosUnicos(){
  return [...new Set(DADOS.map(d => d["CENTRO DE CUSTO"]))].sort();
}

function popularFiltro(){
  const sel = document.getElementById("filtroCentro");
  centrosUnicos().forEach(c => {
    const opt = document.createElement("option");
    opt.value = c; opt.textContent = c;
    sel.appendChild(opt);
  });
}

function renderResumo(lista){
  const totalFolha = lista.reduce((s,d) => s + (typeof d["SALÁRIO"]==="number" ? d["SALÁRIO"] : 0), 0);
  const totalVR = lista.reduce((s,d) => s + (typeof d["VALORES PAGO DE VR"]==="number" ? d["VALORES PAGO DE VR"] : 0), 0);
  const totalVT = lista.reduce((s,d) => s + (typeof d["VALORES PAGO DE VT"]==="number" ? d["VALORES PAGO DE VT"] : 0), 0);
  const cards = [
    {num: lista.length, lbl: "Funcionários"},
    {num: fmtMoney(totalFolha), lbl: "Total Salários"},
    {num: fmtMoney(totalVR), lbl: "Total VR Pago"},
    {num: fmtMoney(totalVT), lbl: "Total VT Pago"},
  ];
  document.getElementById("resumo").innerHTML = cards.map(c =>
    `<div class="card-resumo"><div class="num">${c.num}</div><div class="lbl">${c.lbl}</div></div>`
  ).join("");
}

function renderTabela(lista){
  const grupos = {};
  lista.forEach(d => {
    const c = d["CENTRO DE CUSTO"] || "SEM CENTRO";
    (grupos[c] = grupos[c] || []).push(d);
  });

  const html = Object.keys(grupos).sort().map(centro => {
    const itens = grupos[centro];
    const totalCentro = itens.reduce((s,d) => s + (typeof d["SALÁRIO"]==="number" ? d["SALÁRIO"] : 0), 0);
    const linhas = itens.map(d => {
      const tds = COLS.map(col => {
        const v = d[col.k];
        const cls = ["num"];
        if (col.k === "COLABORADOR") return `<td class="nome">${v}</td>`;
        if (col.destaque && typeof v === "number" && v > 0) cls.push("destaque");
        if (col.cls) cls.push(col.cls);
        return `<td class="${cls.join(' ')}">${fmtVal(v, col)}</td>`;
      }).join("");
      return `<tr>${tds}</tr>`;
    }).join("");

    const head = COLS.map(c => `<th>${c.l}</th>`).join("");

    return `
      <div class="grupo">
        <div class="grupo-titulo">
          <span>${centro} (${itens.length} funcionário${itens.length>1?'s':''})</span>
          <span class="total">Total salários: ${fmtMoney(totalCentro)}</span>
        </div>
        <table>
          <thead><tr>${head}</tr></thead>
          <tbody>${linhas}</tbody>
        </table>
      </div>`;
  }).join("");

  document.getElementById("conteudo").innerHTML = html;
}

function aplicarFiltros(){
  const termo = document.getElementById("busca").value.trim().toLowerCase();
  const centro = document.getElementById("filtroCentro").value;
  const filtrado = DADOS.filter(d => {
    const okCentro = !centro || d["CENTRO DE CUSTO"] === centro;
    const okBusca = !termo ||
      (d["COLABORADOR"]||"").toLowerCase().includes(termo) ||
      (d["CARGO"]||"").toLowerCase().includes(termo);
    return okCentro && okBusca;
  });
  renderResumo(filtrado);
  renderTabela(filtrado);
}

function exportarCSV(){
  const termo = document.getElementById("busca").value.trim().toLowerCase();
  const centro = document.getElementById("filtroCentro").value;
  const filtrado = DADOS.filter(d => {
    const okCentro = !centro || d["CENTRO DE CUSTO"] === centro;
    const okBusca = !termo ||
      (d["COLABORADOR"]||"").toLowerCase().includes(termo) ||
      (d["CARGO"]||"").toLowerCase().includes(termo);
    return okCentro && okBusca;
  });
  const header = ["CENTRO DE CUSTO", ...COLS.map(c=>c.k)];
  const linhas = filtrado.map(d => header.map(k => {
    const v = d[k];
    const s = (v === null || v === undefined) ? "" : String(v).replace(/"/g,'""');
    return `"${s}"`;
  }).join(";"));
  const csv = [header.map(h=>`"${h}"`).join(";"), ...linhas].join("\r\n");
  const blob = new Blob(["\uFEFF" + csv], {type: "text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "apontamentos.csv";
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById("busca").addEventListener("input", aplicarFiltros);
document.getElementById("filtroCentro").addEventListener("change", aplicarFiltros);

popularFiltro();
aplicarFiltros();
</script>
